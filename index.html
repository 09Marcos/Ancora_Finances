<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Âncora Finances</title>
<meta name="description" content="Controle financeiro pessoal: importe extratos e acompanhe saldo e gastos.">
<meta name="theme-color" content="#EDF0EF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#11171E" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<script src="firebase-config.js"></script>
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Âncora">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EDF0EF; --surface:#FFFFFF; --surface-2:#F5F7F6; --ink:#1B2530; --ink-2:#47545F; --ink-3:#77838D;
  --line:#DAE0DE; --brand:#24508F; --brand-ink:#FFFFFF; --brand-soft:#E3EAF5;
  --in:#2E7D5B; --out:#B5452F; --warn:#9C6512; --warn-soft:#FBF0DC; --good-soft:#E2F1E9; --bad-soft:#F8E4DF;
  --focus:#2F6FD6;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#11171E; --surface:#19212A; --surface-2:#1F2833; --ink:#E6EBEE; --ink-2:#B1BCC5; --ink-3:#83909B;
    --line:#2B3642; --brand:#86ABE3; --brand-ink:#0E1620; --brand-soft:#1F2D42;
    --in:#62C095; --out:#E8806A; --warn:#E3AE57; --warn-soft:#3A2F1C; --good-soft:#1C3329; --bad-soft:#3B2420;
    --focus:#8DB4F0; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#11171E; --surface:#19212A; --surface-2:#1F2833; --ink:#E6EBEE; --ink-2:#B1BCC5; --ink-3:#83909B;
  --line:#2B3642; --brand:#86ABE3; --brand-ink:#0E1620; --brand-soft:#1F2D42;
  --in:#62C095; --out:#E8806A; --warn:#E3AE57; --warn-soft:#3A2F1C; --good-soft:#1C3329; --bad-soft:#3B2420;
  --focus:#8DB4F0; color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Schibsted Grotesk",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
.num{font-variant-numeric:tabular-nums}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
img,svg{max-width:100%}

/* Topo */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.top-in{max-width:1120px;margin:0 auto;padding:12px 20px 0;display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px}
.logo{font-weight:800;font-size:22px;letter-spacing:-.02em;display:flex;align-items:center;gap:8px;margin-right:auto}
.logo .mark{width:34px;height:34px;border-radius:10px;background:#1D3F6E;display:inline-flex;align-items:center;justify-content:center;flex:none}
.logo-sub{font-weight:500;color:var(--ink-2)}
.month{display:flex;align-items:center;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px}
.month button{border:0;background:none;width:32px;height:32px;border-radius:50%;cursor:pointer;font-size:18px;line-height:1}
.month button:hover{background:var(--surface-2)}
.month button:disabled{opacity:.3;cursor:default}
.month span{min-width:150px;text-align:center;font-weight:600}
.status{font-size:13px;color:var(--ink-3);min-width:0}
.tabs{flex-basis:100%;display:flex;gap:4px;overflow-x:auto;margin-top:2px}
.tabs button{border:0;background:none;padding:10px 14px;cursor:pointer;color:var(--ink-2);font-weight:600;border-bottom:3px solid transparent;white-space:nowrap}
.tabs button[aria-current="page"]{color:var(--ink);border-bottom-color:var(--brand)}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;cursor:pointer;font-weight:600;display:inline-flex;align-items:center;gap:6px;text-decoration:none}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--out)}
.btn.small{padding:6px 10px;font-size:14px;border-radius:8px}
.btn:disabled{opacity:.55;cursor:default}

main{max-width:1120px;margin:0 auto;padding:22px 20px 110px}
.fab-wrap{position:fixed;right:0;bottom:0;z-index:30;padding:0 18px calc(18px + env(safe-area-inset-bottom,0px)) 0;pointer-events:none}
.fab{pointer-events:auto;width:58px;height:58px;border-radius:18px;border:0;background:var(--brand);color:var(--brand-ink);font-size:30px;line-height:1;cursor:pointer;box-shadow:0 6px 20px rgba(0,0,0,.22);display:flex;align-items:center;justify-content:center}
.fab:hover{filter:brightness(1.08)}
.stale{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
h2{font-size:17px;margin:0 0 12px;letter-spacing:-.01em}
h3{font-size:15px;margin:0 0 8px}
.muted{color:var(--ink-3)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 20px;min-width:0}
.grid{display:grid;gap:16px;margin-top:16px}
@media(min-width:860px){.grid.two{grid-template-columns:1.15fr 1fr}.grid.half{grid-template-columns:1fr 1fr}}

/* Topo do resumo: saldo + faixa do mês */
.hero{display:grid;gap:22px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:24px}
@media(min-width:860px){.hero{grid-template-columns:minmax(260px,.8fr) 1.4fr;align-items:end}}
.bal-label{color:var(--ink-2);font-weight:500}
.bal{font-size:clamp(34px,6vw,52px);font-weight:800;letter-spacing:-.035em;line-height:1.05;margin:4px 0 10px}
.bal.neg{color:var(--out)}
.accs{display:flex;flex-wrap:wrap;gap:6px}
.chip-btn{cursor:pointer;display:inline-flex;align-items:center;gap:5px;font:inherit;font-size:13px}
.chip-btn:hover{border-color:var(--brand);color:var(--ink)}
.chip-btn svg{color:var(--ink-3)}
.adj-who{display:flex;align-items:center;gap:10px;margin:0 0 12px}.adj-who b{display:block}.adj-who small{color:var(--ink-3);font-size:13px}
.lock-link.adj-link{margin-top:6px;padding:4px 0;font-size:14px}
.chip{font-size:13px;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:3px 10px;color:var(--ink-2)}
.chip b{color:var(--ink);font-weight:600}
.flow-nums{display:flex;flex-wrap:wrap;gap:8px 28px;margin-bottom:12px}
.flow-nums div{display:flex;flex-direction:column}
.flow-nums small{color:var(--ink-3);font-size:13px}
.flow-nums strong{font-size:20px;letter-spacing:-.02em}
.strip{display:flex;flex-direction:column;gap:6px}
.strip-row{display:flex;height:22px;border-radius:5px;overflow:hidden;background:var(--surface-2)}
.strip-row > i{display:block;height:100%;min-width:2px}
.strip-row > i + i{border-left:2px solid var(--surface)}
.strip-cap{display:flex;justify-content:space-between;font-size:12px;color:var(--ink-3)}

/* Barras de categorias */
.cats{display:flex;flex-direction:column;gap:11px}
.cat-row{display:grid;grid-template-columns:minmax(110px,150px) 1fr auto;gap:10px;align-items:center}
.cat-name{display:flex;align-items:center;gap:8px;font-size:14px;min-width:0}
.cat-name span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{width:10px;height:10px;border-radius:3px;flex:none}
.bar{position:relative;height:12px;background:var(--surface-2);border-radius:4px}
.bar i{position:absolute;inset:0 auto 0 0;border-radius:4px}
.bar .lim{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink);opacity:.55}
.cat-val{text-align:right;font-size:14px;white-space:nowrap}
.cat-val small{display:block;color:var(--ink-3);font-size:12px}

/* Insights */
.ins{display:flex;flex-direction:column;gap:10px}
.in-item{border-radius:10px;padding:11px 13px;background:var(--surface-2);border-left:4px solid var(--ink-3)}
.in-item.bom{background:var(--good-soft);border-left-color:var(--in)}
.in-item.atencao{background:var(--warn-soft);border-left-color:var(--warn)}
.in-item.ruim{background:var(--bad-soft);border-left-color:var(--out)}
.in-item strong{display:block;margin-bottom:2px}
.in-item p{margin:0;font-size:14px;color:var(--ink-2)}

.legend{display:flex;gap:14px;font-size:13px;color:var(--ink-2);margin-bottom:6px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.chart{width:100%;height:auto;display:block}
.chart text{font-family:inherit;fill:var(--ink-3);font-size:14px}

.list{display:flex;flex-direction:column}
.li{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.li:last-child{border-bottom:0}
.li .l{display:flex;align-items:center;gap:8px;min-width:0}
.li .l span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* Claude */
.ai{margin-top:16px}
.ai-head{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;align-items:center}
.ai-out{margin-top:12px;font-size:15px;line-height:1.6;max-width:75ch}
.ai-out p{margin:0 0 10px}
.ai-out ul{margin:0 0 10px;padding-left:20px}
.ai-out li{margin-bottom:6px}

/* Transações */
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.filters input,.filters select,.field input,.field select{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:8px 11px;min-width:0}
.filters input{flex:1 1 220px}
.day{margin-top:18px}
.day-h{display:flex;justify-content:space-between;font-size:13px;color:var(--ink-3);font-weight:600;padding:0 4px 6px}
.tx{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-bottom-width:0;padding:10px 12px}
.day-h + .tx{border-radius:12px 12px 0 0}
.day .tx:last-child{border-radius:0 0 12px 12px;border-bottom-width:1px}
.day-h + .tx:last-child{border-radius:12px}
.tx-desc{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tx-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--ink-3)}
.tx-meta select{border:1px solid var(--line);background:var(--surface-2);border-radius:7px;padding:2px 6px;font-size:13px;max-width:190px}
.tx-amt{font-weight:600;text-align:right;white-space:nowrap}
.tx-amt.pos{color:var(--in)}
.tx-act{grid-column:2;justify-self:end}
.icon-btn{border:0;background:none;cursor:pointer;color:var(--ink-3);padding:2px 6px;border-radius:6px;font-size:13px}
.icon-btn:hover{background:var(--surface-2);color:var(--out)}

/* Orçamento */
.bud{display:grid;grid-template-columns:minmax(120px,170px) 1fr 120px;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.bud:last-child{border-bottom:0}
.bud input{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 8px;text-align:right}
.bud-info{font-size:13px;color:var(--ink-3);margin-top:4px}
@media(max-width:560px){.bud{grid-template-columns:1fr 110px}.bud .bud-bar{grid-column:1/-1;grid-row:2}}

/* Contas */
.acc{display:grid;grid-template-columns:1fr auto;gap:6px 14px;padding:14px 0;border-bottom:1px solid var(--line)}
.acc:last-child{border-bottom:0}
.acc-act{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px}
.steps{margin:0;padding-left:20px;color:var(--ink-2)}
.steps li{margin-bottom:6px}

/* Vazio */
.empty{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:36px 28px;max-width:720px}
.empty h1{font-size:clamp(26px,4vw,36px);letter-spacing:-.03em;line-height:1.15;margin:0 0 10px}
.empty p{color:var(--ink-2);max-width:60ch}
.empty .row{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
.notes{margin-top:22px;font-size:14px;color:var(--ink-3);max-width:62ch}

/* Diálogo */
dialog{border:1px solid var(--line);border-radius:16px;padding:0;background:var(--surface);color:var(--ink);width:min(560px,calc(100vw - 24px));max-height:calc(100% - 24px)}
dialog::backdrop{background:rgba(10,16,24,.45)}
.dlg{padding:22px}
.dlg h2{font-size:19px}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.field label{font-size:13px;color:var(--ink-2);font-weight:600}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dlg-act{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;flex-wrap:wrap}
.summary{background:var(--surface-2);border-radius:10px;padding:12px 14px;font-size:14px;margin-bottom:14px}
.summary div{display:flex;justify-content:space-between;gap:12px;padding:2px 0}
.review{max-height:42vh;overflow:auto;border:1px solid var(--line);border-radius:10px}
.rv{display:grid;grid-template-columns:auto 44px minmax(0,1fr) auto;gap:8px;align-items:center;padding:6px 10px;border-bottom:1px solid var(--line);font-size:13px}
.rv:last-child{border-bottom:0}
.rv-d{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rv-a{border:1px solid var(--line);background:var(--surface-2);border-radius:7px;padding:3px 8px;cursor:pointer;font-weight:600;white-space:nowrap}
.rv-a.pos{color:var(--in)}
.fx{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:6px 12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.fx:last-child{border-bottom:0}
.fx-main{min-width:0}.fx-main b{display:block}.fx-main small{color:var(--ink-3);font-size:13px}
.fx-v{white-space:nowrap}
.fx-act{grid-column:2/-1;display:flex;flex-wrap:wrap;gap:6px}
.fx-st{font-size:12px;font-weight:700;border-radius:999px;padding:3px 9px;white-space:nowrap;background:var(--surface-2);color:var(--ink-2)}
.fx-st.ok{background:var(--good-soft);color:var(--in)}.fx-st.bad{background:var(--bad-soft);color:var(--out)}.fx-st.warn{background:var(--warn-soft);color:var(--warn)}.fx-st.skip{opacity:.7}
.fx-sum{margin-bottom:0}
.rv-h{padding:8px 10px;font-size:12px;font-weight:700;color:var(--ink-3);background:var(--surface-2);border-bottom:1px solid var(--line)}
.pl{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:8px 10px;border-bottom:1px solid var(--line)}
.pl-n{min-width:0}.pl-n b{display:block;font-size:14px}.pl-n small{font-size:12px}
.pl select{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:5px 6px;font-size:13px;max-width:52%}
@media(max-width:560px){.fx{grid-template-columns:minmax(0,1fr) auto}.fx-st{grid-column:1/-1;justify-self:start}.fx-act{grid-column:1/-1}}
.menu-btn{border:0;background:none;width:40px;height:40px;margin-left:-8px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink)}
.menu-btn:hover{background:var(--surface-2)}
.drawer{position:fixed;inset:0;z-index:60}
.drawer-bg{position:absolute;inset:0;background:rgba(10,16,24,.45);opacity:0;transition:opacity .2s}
.drawer-panel{position:absolute;top:0;bottom:0;left:0;width:min(310px,86vw);background:var(--surface);border-right:1px solid var(--line);overflow-y:auto;padding:calc(12px + env(safe-area-inset-top,0px)) 10px calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-100%);transition:transform .2s ease-out;box-shadow:8px 0 30px rgba(0,0,0,.18)}
.drawer.open .drawer-bg{opacity:1}.drawer.open .drawer-panel{transform:none}
@media (prefers-reduced-motion: reduce){.drawer-bg,.drawer-panel{transition:none}}
.dr-head{display:flex;align-items:center;justify-content:space-between;padding:4px 6px 12px;border-bottom:1px solid var(--line);margin-bottom:6px}
.dr-head .logo{font-size:19px;margin:0}
.icon-x{border:0;background:none;font-size:18px;width:36px;height:36px;border-radius:9px;cursor:pointer;color:var(--ink-2)}
.icon-x:hover{background:var(--surface-2)}
.dr-t{font-size:12px;font-weight:700;color:var(--ink-3);padding:14px 10px 4px}
.dr-sec{display:flex;flex-direction:column}
.dr-i{display:flex;align-items:center;gap:12px;border:0;background:none;text-align:left;padding:11px 10px;border-radius:10px;cursor:pointer;font-weight:500;color:var(--ink)}
.dr-i svg{color:var(--ink-2);flex:none}
.dr-i:hover{background:var(--surface-2)}
.dr-i[aria-current="page"]{background:var(--brand-soft);color:var(--brand);font-weight:700}
.dr-i[aria-current="page"] svg{color:var(--brand)}
.dr-foot{font-size:12px;color:var(--ink-3);padding:16px 10px 0;margin:0}
body.is-locked .top,body.is-locked main,body.is-locked .fab-wrap{visibility:hidden}
.lock{position:fixed;inset:0;z-index:80;background:var(--bg);display:flex;align-items:center;justify-content:center;overflow-y:auto;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px))}
.lock-in{width:100%;max-width:320px;display:flex;flex-direction:column;align-items:center;text-align:center}
.lock-form{display:flex;gap:8px;width:100%;margin:4px 0 14px}
.lock-form input{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:12px 14px;font-size:16px}
.lock-form.shake{animation:shake .35s}
.lock-bio{width:100%;justify-content:center;padding:12px}
.lock-bio svg,.setup-form .btn svg{width:22px;height:22px}
.setup .lock-msg{max-width:34ch}
.setup-form{display:flex;flex-direction:column;gap:6px;width:100%;text-align:left;margin-top:4px}
.setup-form label,.setup-form .lbl{font-size:13px;font-weight:600;color:var(--ink-2);margin-top:6px}
.setup-form input{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:11px 13px;font-size:16px}
.setup-form .seg{width:100%}.setup-form .seg button{flex:1}
.setup-form .btn{justify-content:center;padding:12px;margin-top:6px}
.setup-form .lock-msg{margin:2px 0;min-height:0;text-align:left}
.setup-note{font-size:12px;color:var(--ink-3);margin-top:16px;max-width:36ch}
.auth-tabs{width:100%;margin:6px 0 4px}.auth-tabs button{flex:1}
.or{font-size:13px;color:var(--ink-3);margin:12px 0 4px}
.lock-link.muted-link{color:var(--ink-3);font-weight:500;margin-top:4px}
.lock-mark{width:64px;height:64px;border-radius:18px;background:#1D3F6E;display:flex;align-items:center;justify-content:center}
.lock-mark svg{width:36px;height:36px}
.lock h1{font-size:24px;letter-spacing:-.02em;margin:14px 0 4px}
.lock-msg{color:var(--ink-2);margin:6px 0 16px;min-height:1.5em}
.lock-msg.bad{color:var(--out)}
.dots{display:flex;gap:14px;margin-bottom:26px}
.dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--ink-3)}
.dots i.on{background:var(--brand);border-color:var(--brand)}
.dots.shake{animation:shake .35s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
@media (prefers-reduced-motion: reduce){.dots.shake{animation:none}}
.pad{display:grid;grid-template-columns:repeat(3,72px);gap:14px 22px;justify-content:center}
.key{width:72px;height:72px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:26px;font-weight:500;cursor:pointer;color:var(--ink);display:flex;align-items:center;justify-content:center}
.key:active{background:var(--surface-2)}
.key-ic{border-color:transparent;background:none;color:var(--brand)}
.lock-link{margin-top:22px;border:0;background:none;color:var(--brand);font-weight:600;cursor:pointer;padding:8px}
.sec-row{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px 12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.sec-row b{display:block}.sec-row small{color:var(--ink-3);font-size:13px}
.sec-act{display:flex;gap:6px;flex-wrap:wrap}
@media(max-width:600px){.desk-only{display:none}}

<script>
/* ---------- Categorias (cores inspiradas nas cédulas do Real) ---------- */
const CATS = [
  {id:'alimentacao', name:'Alimentação', color:'#C46A2A', kind:'gasto'},
  {id:'mercado', name:'Mercado', color:'#5E7F2F', kind:'gasto'},
  {id:'transporte', name:'Transporte', color:'#2A5B9C', kind:'gasto'},
  {id:'moradia', name:'Moradia', color:'#8A7A62', kind:'gasto'},
  {id:'contas', name:'Contas da casa', color:'#4E7A9B', kind:'gasto'},
  {id:'saude', name:'Saúde', color:'#3C8C7A', kind:'gasto'},
  {id:'lazer', name:'Lazer', color:'#7B4E9B', kind:'gasto'},
  {id:'assinaturas', name:'Assinaturas', color:'#A64870', kind:'gasto'},
  {id:'compras', name:'Compras', color:'#B5452F', kind:'gasto'},
  {id:'educacao', name:'Educação', color:'#C9962B', kind:'gasto'},
  {id:'viagem', name:'Viagem', color:'#2F7D96', kind:'gasto'},
  {id:'pix', name:'Pix e transferências', color:'#6E6A86', kind:'gasto'},
  {id:'outros', name:'Outros gastos', color:'#8C8C84', kind:'gasto'},
  {id:'renda', name:'Salário e renda', color:'#2E7D5B', kind:'entrada'},
  {id:'entradas', name:'Outras entradas', color:'#5A9E7C', kind:'entrada'},
  {id:'investimentos', name:'Investimentos', color:'#3B4A5C', kind:'neutro'},
  {id:'fatura', name:'Pagamento de fatura', color:'#9AA0A6', kind:'neutro'},
  {id:'interna', name:'Entre minhas contas', color:'#9AA0A6', kind:'neutro'},
];
const CAT = Object.fromEntries(CATS.map(c=>[c.id,c]));
const EXP_CATS = CATS.filter(c=>c.kind==='gasto');

const KW_NEUTRAL = [
  ['fatura',[' pagamento de fatura',' pagamento fatura',' pgto fatura',' pag fatura',' pagamento recebido',' fatura cartao',' pagto cartao',' pag cartao']],
  ['interna',[' reserva por',' dinheiro reservado',' caixinha',' cofrinho',' transferencia entre contas',' mesma titularidade',' entre contas',' transf mesma tit']],
  ['investimentos',[' aplicacao',' resgate',' cdb',' rdb ',' tesouro direto',' investimento',' corretora',' lci ',' lca ',' poupanca']],
];
const KW_INCOME = [['renda',[' salario',' folha de pagamento',' proventos',' remuneracao',' pro labore',' prolabore',' pagto salario']]];
const KW_EXP = [
  ['assinaturas',[' netflix',' spotify',' disney',' hbo',' prime video',' amazon prime',' youtube premium',' youtube',' apple com',' icloud',' google one',' deezer',' globoplay',' paramount',' chatgpt',' openai',' anthropic',' claude ai',' adobe',' crunchyroll']],
  ['alimentacao',[' alimentacao',' ifood',' rappi',' restaurante',' lanchonete',' padaria',' burger',' mcdonald',' pizza',' cafe ',' cafeteria',' starbucks',' outback',' habib',' subway',' sushi',' churrascaria',' bar ',' bk ',' delivery',' ze delivery',' sorveteria',' acai']],
  ['mercado',[' supermercado',' mercado ',' mercadinho',' carrefour',' pao de acucar',' assai',' atacadao',' atacadista',' hortifruti',' zaffari',' guanabara',' sonda',' st marche',' oba ',' mambo',' dia brasil',' sams club',' quitanda']],
  ['transporte',[' gasolina',' seguro moto',' seguro auto',' seguro do carro',' ipva',' uber',' 99 ',' 99app',' 99pop',' 99 pop',' cabify',' posto',' shell',' ipiranga',' petrobras',' br mania',' combustivel',' estacionamento',' sem parar',' conectcar',' veloe',' metro ',' onibus',' bilhete unico',' cptm',' pedagio',' localiza',' movida']],
  ['moradia',[' terreno',' garagem',' aluguel',' condominio',' iptu',' quintoandar',' quinto andar',' imobiliaria']],
  ['contas',[' celular',' conta de agua',' contador',' enel',' light ',' cemig',' copel',' sabesp',' celpe',' coelba',' cpfl',' energia',' saneamento',' vivo',' claro',' tim ',' net virtua',' internet',' comgas',' naturgy',' conta de agua',' conta de luz',' oi fibra']],
  ['saude',[' convenio',' plano de saude',' farmacia',' drogaria',' droga raia',' drogasil',' raia ',' pague menos',' panvel',' unimed',' amil',' hapvida',' sulamerica',' bradesco saude',' laboratorio',' hospital',' clinica',' consulta',' dentista',' odonto',' academia',' smart fit',' smartfit',' gympass',' wellhub']],
  ['lazer',[' cinema',' cinemark',' ingresso',' sympla',' eventim',' steam',' playstation',' xbox',' nintendo',' show ',' parque',' teatro',' museu']],
  ['viagem',[' hotel',' airbnb',' booking',' latam',' gol linhas',' azul linhas',' decolar',' 123milhas',' hoteis',' pousada',' passagem']],
  ['educacao',[' escola',' faculdade',' universidade',' curso',' udemy',' alura',' coursera',' livraria',' mensalidade escolar',' colegio']],
  ['compras',[' amazon',' mercado livre',' mercadolivre',' magalu',' magazine luiza',' americanas',' shopee',' shein',' aliexpress',' renner',' riachuelo',' c&a',' zara',' centauro',' netshoes',' kabum',' casas bahia',' leroy merlin',' ikea',' tok&stok',' decathlon']],
];

/* ---------- Utilidades ---------- */
const $ = s=>document.querySelector(s);
const esc = s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const BRL = new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'});
const money = v=>BRL.format(v||0).replace(/\u00a0/g,' ');
const money0 = v=>new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL',maximumFractionDigits:0}).format(v||0).replace(/\u00a0/g,' ');
const pad = n=>String(n).padStart(2,'0');
const round2 = v=>Math.round(v*100)/100;
const norm = s=>String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
const uid = ()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);
const monthOf = d=>d.slice(0,7);
function todayISO(){const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function addMonths(m,n){let [y,mo]=m.split('-').map(Number);mo+=n;while(mo>12){mo-=12;y++}while(mo<1){mo+=12;y--}return y+'-'+pad(mo)}
function daysIn(m){const [y,mo]=m.split('-').map(Number);return new Date(y,mo,0).getDate()}
function monthLabel(m,short){const [y,mo]=m.split('-').map(Number);const d=new Date(y,mo-1,1);
  if(short)return d.toLocaleDateString('pt-BR',{month:'short'}).replace('.','');
  const s=d.toLocaleDateString('pt-BR',{month:'long',year:'numeric'});return s[0].toUpperCase()+s.slice(1)}
function dayLabel(iso){const [y,m,d]=iso.split('-').map(Number);const s=new Date(y,m-1,d).toLocaleDateString('pt-BR',{weekday:'short',day:'numeric',month:'short'});return s.replace(/\./g,'')}
function fmtDate(iso){if(!iso)return'';const [y,m,d]=iso.split('-');return d+'/'+m+'/'+y}
function pct(v){return (v*100).toFixed(0)+'%'}

const STOP = new Set(['compra','compras','pagamento','pag','pgto','pagto','cartao','debito','credito','parcela','de','do','da','no','na','em','com','pix','enviado','enviada','recebido','recebida','transferencia','ted','doc','elo','visa','master','mastercard','ltda','me','sa','br','bra','sao','paulo','rio','janeiro','brasil','www','com','compra no debito']);
function merchantKey(desc){
  const w=norm(desc).replace(/[^a-z& ]+/g,' ').split(/\s+/).filter(x=>x.length>1&&!STOP.has(x));
  return w.slice(0,3).join(' ')||norm(desc).trim();
}
function cleanName(desc){
  let s=String(desc||'').replace(/\s+/g,' ').trim();
  if(s===s.toUpperCase()) s=s.toLowerCase().replace(/(^|[\s*\-\/])([a-zà-ú])/g,(m,a,b)=>a+b.toUpperCase());
  return s.length>46?s.slice(0,44)+'…':s;
}
function categorize(desc,amt){
  const k=merchantKey(desc); if(S.rules[k]&&CAT[S.rules[k]]) return S.rules[k];
  const n=' '+norm(desc).replace(/[^a-z0-9& ]+/g,' ').replace(/\s+/g,' ')+' ';
  for(const [c,ws] of KW_NEUTRAL) if(ws.some(w=>n.includes(w))) return c;
  if(amt<0&&/ saque/.test(n)&&S.accounts.some(a=>a.type==='dinheiro')) return 'interna';
  if(amt>0){
    for(const [c,ws] of KW_INCOME) if(ws.some(w=>n.includes(w))) return c;
    if(/ estorno| reembolso| devolucao| cashback/.test(n)){for(const [c,ws] of KW_EXP) if(ws.some(w=>n.includes(w))) return c;return 'outros'}
    return 'entradas';
  }
  for(const [c,ws] of KW_EXP) if(ws.some(w=>n.includes(w))) return c;
  if(/ pix | ted | doc | transf/.test(n)) return 'pix';
  return 'outros';
}

/* ---------- Estado ---------- */
let S = {accounts:[],tx:[],budgets:{},rules:{},fixed:[]};
const view = {bank:'',tab:'resumo',month:null,q:'',fAcc:'',fCat:'',aiText:'',aiBusy:false,aiErr:'',aiMonth:null};
const caps = {sample:null};
const store = {mode:'local',db:null,uid:null,last:{},timer:null,saving:false,again:false,status:''};
const LS_KEY='caixa:v1';

function loadLocal(){try{const r=localStorage.getItem(LS_KEY);if(!r)return null;const d=JSON.parse(r);if(d&&Array.isArray(d.tx))return d}catch(e){}return null}
function saveLocal(){try{localStorage.setItem(LS_KEY,JSON.stringify(S));return true}catch(e){setStatus('error');return false}}
function hasData(){return S.tx.length>0||S.accounts.length>0||(S.fixed||[]).length>0}

function setStatus(s){
  store.status=s;
  const m={loading:'Carregando seus dados…',saving:'Sincronizando…',synced:'Sincronizado com a sua conta',offline:'Sem internet: salvo no aparelho, sincroniza depois',local:'Salvo só neste aparelho',error:'Não foi possível sincronizar agora. As alterações ficam guardadas e serão enviadas depois.'};
  $('#status').textContent=m[s]||'';
}
function persist(){clearTimeout(store.timer);store.timer=setTimeout(flush,500);if(FB.mode==='cloud'&&FB.user)setStatus('saving')}
async function flush(){
  store.timer=null;
  if(FB.mode!=='cloud'||!FB.user||!FB.col){if(saveLocal())setStatus('local');return}
  const writes=[];const meta=JSON.stringify(metaOf(S));
  if(meta!==FB.last.meta){writes.push(['set','meta',JSON.parse(meta)]);FB.last.meta=meta}
  const groups={};for(const t of S.tx){const k='tx-'+monthOf(t.date);(groups[k]||(groups[k]=[])).push(t)}
  for(const [k,items] of Object.entries(groups)){const j=JSON.stringify(items);if(FB.last[k]!==j){writes.push(['set',k,{items:JSON.parse(j)}]);FB.last[k]=j;if(j.length>900000)toast('Um mês tem lançamentos demais para sincronizar. Fale com o suporte do app.')}}
  for(const k of Object.keys(FB.last)){if(k.startsWith('tx-')&&!groups[k]){writes.push(['del',k]);delete FB.last[k]}}
  if(!writes.length){setStatus(navigator.onLine?'synced':'offline');return}
  setStatus(navigator.onLine?'saving':'offline');
  try{
    for(let i=0;i<writes.length;i+=400){const bt=FB.db.batch();for(const w of writes.slice(i,i+400)){if(w[0]==='set')bt.set(FB.col.doc(w[1]),w[2]);else bt.delete(FB.col.doc(w[1]))}await bt.commit()}
    setStatus('synced');
  }catch(e){console.error(e);setStatus('error')}
}
function migrateBanks(){let m=false;for(const a of S.accounts){if(!a.bank&&a.type!=='dinheiro'){const b=BANKS.find(b=>b.re.test(norm(a.name)));if(b){a.bank=b.id;m=true}}}return m}
async function initStore(){
  const local=loadLocal(); if(local){S={accounts:[],budgets:{},rules:{},fixed:[],...local}}
  let mig=false;for(const a of S.accounts){if(!a.bank&&a.type!=='dinheiro'){const b=BANKS.find(b=>b.re.test(norm(a.name)));if(b){a.bank=b.id;mig=true}}}if(mig)saveLocal();
  setStatus(hasData()?'local':'');
  pickDefaultMonth(); render();
  try{if(navigator.storage&&navigator.storage.persist)await navigator.storage.persist()}catch(e){}
}
function pickDefaultMonth(){
  const cur=monthOf(todayISO());
  if(view.month && S.tx.some(t=>t.date.startsWith(view.month))) return;
  if(!S.tx.length){view.month=cur;return}
  const months=[...new Set(S.tx.map(t=>monthOf(t.date)))].sort();
  let m=months.includes(cur)?cur:months[months.length-1];
  const nCur=S.tx.filter(t=>t.date.startsWith(m)&&t.amt<0).length;
  if(nCur<8&&months.includes(addMonths(m,-1))) m=addMonths(m,-1);
  view.month=m;
}

/* ---------- Cálculos ---------- */
function monthStats(m){
  const txs=S.tx.filter(t=>t.date.startsWith(m));
  let income=0,expense=0;const byCat={},byMerchant={};
  for(const t of txs){const k=CAT[t.cat]?.kind||'gasto';
    if(k==='entrada') income+=t.amt;
    else if(k==='gasto'){const v=-t.amt;expense+=v;byCat[t.cat]=(byCat[t.cat]||0)+v;
      if(v>0){const mk=merchantKey(t.desc);const o=byMerchant[mk]||(byMerchant[mk]={name:cleanName(t.desc),total:0,n:0,cat:t.cat});o.total+=v;o.n++}}
  }
  return {m,txs,income,expense,net:income-expense,byCat,byMerchant};
}
function accBalance(a,upto){
  let sum=a.anchorDate?a.anchorAmt:(a.initial||0);
  for(const t of S.tx){if(t.acc!==a.id)continue;
    if(a.anchorDate){
      if(!upto){if(t.date>a.anchorDate)sum+=t.amt}
      else{if(t.date>a.anchorDate&&t.date<=upto)sum+=t.amt;else if(t.date<=a.anchorDate&&t.date>upto)sum-=t.amt}
    } else if(!upto||t.date<=upto) sum+=t.amt;
  }
  return round2(sum);
}
const bankAccs=()=>S.accounts.filter(a=>a.type!=='cartao');
const cardAccs=()=>S.accounts.filter(a=>a.type==='cartao');
const totalBank=upto=>bankAccs().reduce((s,a)=>s+accBalance(a,upto),0);
function avgPrev(m,n=3){
  const st=[];for(let i=1;i<=n;i++){const s=monthStats(addMonths(m,-i));if(s.txs.length)st.push(s)}
  const byCat={};let exp=0,inc=0;
  for(const s of st){exp+=s.expense;inc+=s.income;for(const [c,v] of Object.entries(s.byCat))byCat[c]=(byCat[c]||0)+v}
  const k=st.length||1;for(const c in byCat)byCat[c]/=k;
  return {n:st.length,expense:exp/k,income:inc/k,byCat};
}
function recurring(m){
  const months=[m,addMonths(m,-1),addMonths(m,-2)];const map={};
  for(const t of S.tx){if(t.amt>=0||CAT[t.cat]?.kind!=='gasto')continue;const mo=monthOf(t.date);if(!months.includes(mo))continue;
    const k=merchantKey(t.desc);const o=map[k]||(map[k]={name:cleanName(t.desc),cat:t.cat,months:{}});(o.months[mo]||(o.months[mo]=[])).push(-t.amt)}
  const out=[];
  for(const o of Object.values(map)){const ms=Object.keys(o.months);if(ms.length<2)continue;
    if(ms.some(x=>o.months[x].length>2))continue;
    const vals=ms.map(x=>o.months[x].reduce((a,b)=>a+b,0)).sort((a,b)=>a-b);const med=vals[Math.floor(vals.length/2)];
    if(vals.every(v=>Math.abs(v-med)<=Math.max(5,med*.2))){const last=ms.sort().pop();out.push({name:o.name,cat:o.cat,amount:o.months[last].reduce((a,b)=>a+b,0)})}}
  return out.sort((a,b)=>b.amount-a.amount);
}
function insights(m){
  const cur=monthStats(m),avg=avgPrev(m),out=[];
  const today=todayISO(),isCur=m===monthOf(today);
  if(!cur.txs.length) return out;
  if(cur.income>0){const r=cur.net/cur.income;
    if(r>=.2) out.push({tone:'bom',t:`Você guardou ${pct(r)} do que entrou`,p:`Sobraram ${money(cur.net)} neste mês. Acima de 20% é um ritmo saudável para formar reserva.`});
    else if(r>=0) out.push({tone:'atencao',t:`Sobrou ${pct(r)} do que entrou`,p:`Ficaram ${money(cur.net)} no mês. Mirar em 20% (${money(cur.income*.2)}) ajuda a formar uma reserva.`});
    else out.push({tone:'ruim',t:`Você gastou ${money(-cur.net)} a mais do que recebeu`,p:`As saídas superaram as entradas neste mês. Veja abaixo quais categorias mais pesaram.`});
  }
  if(isCur){const day=Number(today.slice(8)),dm=daysIn(m);
    if(day<dm&&day>=5&&cur.expense>0){const proj=cur.expense/day*dm;
      const cmp=avg.n?` A média dos últimos meses é ${money(avg.expense)}.`:'';
      out.push({tone:avg.n&&proj>avg.expense*1.1?'atencao':'neutro',t:`No ritmo atual, o mês fecha com ${money(proj)} em gastos`,p:`Até hoje foram ${money(cur.expense)} em ${day} dias.${cmp}`})}}
  if(avg.n){
    const diffs=EXP_CATS.map(c=>{const v=cur.byCat[c.id]||0,a=avg.byCat[c.id]||0;return {c,v,a,d:v-a}});
    const ups=diffs.filter(x=>x.a>=40&&x.d>=60&&x.d/x.a>=.25).sort((a,b)=>b.d-a.d).slice(0,2);
    for(const x of ups) out.push({tone:'atencao',t:`${x.c.name}: ${money(x.v)}, ${pct(x.d/x.a)} acima da média`,p:`Nos ${avg.n} meses anteriores você gastou em média ${money(x.a)} aqui. Diferença de ${money(x.d)}.`});
    const down=diffs.filter(x=>x.a>=60&&-x.d>=60&&-x.d/x.a>=.25&&!isCur).sort((a,b)=>a.d-b.d)[0];
    if(down) out.push({tone:'bom',t:`${down.c.name} caiu ${pct(-down.d/down.a)}`,p:`Foram ${money(down.v)} contra a média de ${money(down.a)}. Economia de ${money(-down.d)}.`});
  }
  const over=EXP_CATS.filter(c=>S.budgets[c.id]>0&&(cur.byCat[c.id]||0)>S.budgets[c.id]);
  if(over.length) out.push({tone:'ruim',t:`Orçamento estourado em ${over.length===1?over[0].name:over.length+' categorias'}`,p:over.map(c=>`${c.name}: ${money(cur.byCat[c.id])} de ${money(S.budgets[c.id])}`).join(' · ')});
  const rec=recurring(m).filter(r=>r.cat==='assinaturas');
  if(rec.length){const tot=rec.reduce((s,r)=>s+r.amount,0);out.push({tone:'neutro',t:`${rec.length} assinatura${rec.length>1?'s':''} somam ${money(tot)} por mês`,p:`Equivale a ${money(tot*12)} por ano. Vale revisar se todas ainda são usadas.`})}
  const big=cur.txs.filter(t=>t.amt<0&&CAT[t.cat]?.kind==='gasto').sort((a,b)=>a.amt-b.amt)[0];
  if(big&&cur.expense>0&&-big.amt/cur.expense>.15&&big.cat!=='moradia') out.push({tone:'neutro',t:`Maior gasto do mês: ${cleanName(big.desc)}`,p:`${money(-big.amt)} em ${fmtDate(big.date)}, ${pct(-big.amt/cur.expense)} de tudo o que saiu.`});
  return out;
}

/* ---------- Gráficos ---------- */
function trendSVG(m){
  const months=[...Array(6)].map((_,i)=>addMonths(m,i-5)),st=months.map(monthStats);
  const W=560,H=210,pl=6,pr=6,pt=12,pb=30,ih=H-pt-pb;
  const max=Math.max(1,...st.map(s=>Math.max(s.income,s.expense)));
  const gw=(W-pl-pr)/6,bw=Math.min(24,gw*.3);let g='';
  g+=`<line x1="${pl}" x2="${W-pr}" y1="${pt+ih}" y2="${pt+ih}" stroke="var(--line)"/>`;
  st.forEach((s,i)=>{const cx=pl+i*gw+gw/2;const hi=s.income/max*ih,he=s.expense/max*ih;
    g+=`<rect x="${cx-bw-2}" y="${pt+ih-hi}" width="${bw}" height="${hi}" rx="3" fill="var(--in)"><title>${monthLabel(s.m)} · entradas ${money(s.income)}</title></rect>`;
    g+=`<rect x="${cx+2}" y="${pt+ih-he}" width="${bw}" height="${he}" rx="3" fill="var(--out)"><title>${monthLabel(s.m)} · gastos ${money(s.expense)}</title></rect>`;
    g+=`<text x="${cx}" y="${H-10}" text-anchor="middle" style="${s.m===m?'fill:var(--ink);font-weight:700':''}">${monthLabel(s.m,true)}</text>`});
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Entradas e gastos dos últimos 6 meses">${g}</svg>`;
}
function balanceSVG(m){
  if(!bankAccs().length) return `<p class="muted">Adicione uma conta corrente ou poupança para ver a evolução do saldo.</p>`;
  const today=todayISO();const last=m===monthOf(today)?Number(today.slice(8)):daysIn(m);
  if(m>monthOf(today)) return `<p class="muted">Este mês ainda não começou.</p>`;
  const vals=[];for(let d=1;d<=last;d++)vals.push(totalBank(m+'-'+pad(d)));
  const W=560,H=210,pl=6,pr=6,pt=18,pb=30,ih=H-pt-pb;
  let min=Math.min(...vals),max=Math.max(...vals);if(min>0)min=Math.min(min,max*.6);if(max===min){max+=1;min-=1}
  const dm=daysIn(m),x=i=>pl+(i/(dm-1||1))*(W-pl-pr),y=v=>pt+ih-(v-min)/(max-min)*ih;
  const pts=vals.map((v,i)=>`${x(i).toFixed(1)},${y(v).toFixed(1)}`);
  let g='';
  if(min<0&&max>0)g+=`<line x1="${pl}" x2="${W-pr}" y1="${y(0)}" y2="${y(0)}" stroke="var(--out)" stroke-dasharray="4 4" opacity=".6"/>`;
  g+=`<path d="M${x(0)},${pt+ih} L${pts.join(' L')} L${x(vals.length-1)},${pt+ih} Z" fill="var(--brand)" opacity=".12"/>`;
  g+=`<polyline points="${pts.join(' ')}" fill="none" stroke="var(--brand)" stroke-width="2.5" stroke-linejoin="round"/>`;
  const lo=vals.indexOf(Math.min(...vals));
  g+=`<circle cx="${x(lo)}" cy="${y(vals[lo])}" r="4" fill="var(--surface)" stroke="var(--brand)" stroke-width="2"><title>Menor saldo: ${money(vals[lo])}</title></circle>`;
  g+=`<circle cx="${x(vals.length-1)}" cy="${y(vals[vals.length-1])}" r="4.5" fill="var(--brand)"/>`;
  const lx=Math.min(x(lo),W-90);
  g+=`<text x="${Math.max(lx,4)}" y="${Math.min(y(vals[lo])+18,H-34)}" style="fill:var(--ink-2)">mín. ${money0(vals[lo])}</text>`;
  [1,10,20,dm].forEach(d=>g+=`<text x="${x(d-1)}" y="${H-10}" text-anchor="${d===1?'start':d===dm?'end':'middle'}">${d}</text>`);
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Saldo dia a dia no mês">${g}</svg>`;
}

function setCategory(id,cat){
  const t=S.tx.find(x=>x.id===id);if(!t)return;
  t.cat=cat;t.man=true;const k=merchantKey(t.desc);let n=0;
  if(k&&k.length>2){S.rules[k]=cat;for(const o of S.tx){if(o!==t&&!o.man&&merchantKey(o.desc)===k&&o.cat!==cat&&Math.sign(o.amt)===Math.sign(t.amt)){o.cat=cat;n++}}}
  persist();render();
  toast(n?`Categoria aplicada a mais ${n} lançamento${n>1?'s':''} parecido${n>1?'s':''}`:'Categoria alterada');
}

function detectBank({lines=[],fileName='',codes=[],header=''}){
  for(const c of codes){const k=String(c||'').replace(/\D/g,'');if(!k)continue;const b=BANKS.find(b=>b.codes.includes(k)||b.codes.includes(k.padStart(3,'0')));if(b)return b.id}
  const sc={};const add=(id,v)=>sc[id]=(sc[id]||0)+v;
  const fn=norm(fileName);for(const b of BANKS)if(b.re.test(fn))add(b.id,10);
  const h=norm(header);if(h){if(/^date,title,amount|^date,category,title,amount|^data,valor,identificador,descricao/.test(h.replace(/\s/g,'')))add('nubank',8);for(const b of BANKS)if(b.re.test(h))add(b.id,5)}
  const capped={};const N=lines.length;
  lines.forEach((l,i)=>{const n=norm(l);if(!n.trim())return;const hasAmt=/\d,\d{2}\b/.test(n);
    const w=i<15?5:i>=N-10?4:hasAmt?0.2:1;
    for(const b of BANKS)if(b.re.test(n)){if(hasAmt&&i>=15&&i<N-10){capped[b.id]=(capped[b.id]||0)+w;if(capped[b.id]>0.9)continue}add(b.id,w)}});
  const best=Object.entries(sc).sort((a,b)=>b[1]-a[1])[0];
  return best&&best[1]>=1.5?best[0]:'';
}

/* ---------- Contas fixas ---------- */
const FX_STOP=new Set(['conta','contas','pagamento','mensal','mensalidade','fatura','valor','com','para']);
const fxList=()=>S.fixed||(S.fixed=[]);
function fxAmount(f,m){
  if(f.amounts&&f.amounts[m]!=null)return f.amounts[m];
  if(f.start&&m<f.start)return 0;if(f.end&&m>f.end)return 0;
  return f.amount||0;
}
function fxPhrases(f){
  if((f.match||'').trim())return f.match.split(',').map(p=>' '+norm(p).replace(/[^a-z0-9& ]+/g,' ').replace(/\s+/g,' ').trim()).filter(p=>p.length>2);
  return norm(f.name).replace(/[^a-z0-9 ]+/g,' ').split(/\s+/).filter(w=>w.length>=4&&!FX_STOP.has(w)).map(w=>' '+w);
}
function fxStatus(m){
  const items=fxList().map(f=>({f,exp:round2(fxAmount(f,m))})).filter(x=>x.exp>0);
  const txs=S.tx.filter(t=>t.date.startsWith(m));
  const used=new Set(),res={};
  for(const x of items){const st=x.f.paid&&x.f.paid[m];if(st==='manual')res[x.f.id]={state:'paga',manual:true};else if(st==='skip')res[x.f.id]={state:'skip'}}
  for(const x of items.filter(x=>!res[x.f.id]).sort((a,b)=>b.exp-a.exp)){
    const sign=x.f.kind==='entrada'?1:-1,ph=fxPhrases(x.f);
    const diff=t=>Math.abs(Math.abs(t.amt)-x.exp);
    let best=null,score=0;
    for(const t of txs){
      if(used.has(t.id)||Math.sign(t.amt)!==sign)continue;
      const n=' '+norm(t.desc).replace(/[^a-z0-9& ]+/g,' ').replace(/\s+/g,' ')+' ';
      const kw=ph.some(p=>n.includes(p));
      let s=0;
      if(kw&&diff(t)<=Math.max(2,x.exp*(x.f.match?.4:.25)))s=3;
      else if(x.f.cat&&t.cat===x.f.cat&&diff(t)<=Math.max(1,x.exp*.08))s=2;
      if(s>score||(s&&s===score&&diff(t)<diff(best))){best=t;score=s}
    }
    if(best){used.add(best.id);res[x.f.id]={state:'paga',tx:best}}
  }
  const today=todayISO(),cur=monthOf(today);
  for(const x of items){if(res[x.f.id])continue;
    const due=x.f.day?m+'-'+pad(Math.min(x.f.day,daysIn(m))):null;
    let state='pendente';if(m<cur)state='sem';else if(m===cur&&due&&due<today)state='vencida';
    res[x.f.id]={state,due};
  }
  return {items,res};
}
function fxStateLabel(f,r){
  const ent=f.kind==='entrada';
  if(r.state==='paga')return ['ok',ent?'Recebida':'Paga'];
  if(r.state==='skip')return ['skip','Não se aplica'];
  if(r.state==='vencida')return ['bad',ent?'Atrasada':'Vencida'];
  if(r.state==='sem')return ['bad',ent?'Não identificada':'Sem pagamento'];
  if(r.due){const d=Math.round((Date.parse(r.due)-Date.parse(todayISO()))/864e5);if(d>=0&&d<=3)return ['warn',d===0?'Vence hoje':`Vence em ${d} dia${d>1?'s':''}`]}
  return ['wait',ent?'A receber':'A pagar'];
}
function fxRangeLabel(f){
  const ms=m=>monthLabel(m,true);
  if(f.start&&f.end)return `${ms(f.start)} a ${ms(f.end)} de ${f.end.slice(0,4)}`;
  if(f.end)return `até ${ms(f.end)} de ${f.end.slice(0,4)}`;
  if(f.start&&f.start>monthOf(todayISO()))return `a partir de ${ms(f.start)} de ${f.start.slice(0,4)}`;
  return '';
}
function fxRow(x,r){
  const f=x.f,[cls,lab]=fxStateLabel(f,r);
  const det=[];
  if(f.day)det.push(`dia ${f.day}`);
  if(r.tx)det.push(`${f.kind==='entrada'?'recebida':'paga'} em ${fmtDate(r.tx.date).slice(0,5)}: ${esc(cleanName(r.tx.desc))} ${money(Math.abs(r.tx.amt))}`);
  else if(r.manual)det.push('marcada à mão');
  if(CAT[f.cat])det.push(esc(CAT[f.cat].name));
  const acts=r.state==='paga'&&!r.manual?'':(r.manual||r.state==='skip')?`<button class="btn small" data-fxundo="${f.id}">Desfazer</button>`:`<button class="btn small" data-fxpay="${f.id}">${f.kind==='entrada'?'Marcar como recebida':'Marcar como paga'}</button><button class="btn small" data-fxskip="${f.id}">Não se aplica</button>`;
  return `<div class="fx"><span class="fx-st ${cls}">${cls==='ok'?'✓ ':''}${lab}</span>
    <div class="fx-main"><b>${esc(f.name)}</b><small>${det.join(' · ')}</small></div>
    <b class="num fx-v">${money(x.exp)}</b>
    <div class="fx-act">${acts}<button class="btn small" data-fxedit="${f.id}">Editar</button></div></div>`;
}
function fixasHTML(){
  const m=view.month;
  const head=`<div style="display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:center;margin-bottom:14px"><h2 style="margin:0">Contas fixas de ${monthLabel(m).toLowerCase()}</h2><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn small" id="fxImp">Importar planilha (Excel)</button><button class="btn small primary" id="fxNew">Adicionar conta fixa</button></div></div>`;
  if(!fxList().length)return head+`<section class="panel"><h3>Cadastre o que você paga e recebe todo mês</h3><p class="muted" style="max-width:62ch">Aluguel, luz, água, celular, convênio, salário. O Âncora avisa o que já foi pago, o que vence nos próximos dias e quanto sobra depois das contas fixas. Quando o extrato é importado, os pagamentos são reconhecidos sozinhos.</p><p class="muted" style="max-width:62ch">Se você já controla isso numa planilha do Excel com os meses nas colunas, toque em <b>Importar planilha</b>.</p></section>`;
  const {items,res}=fxStatus(m);
  const out=items.filter(x=>x.f.kind!=='entrada'),inn=items.filter(x=>x.f.kind==='entrada');
  const sum=a=>a.reduce((s,x)=>s+x.exp,0);

function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=()=>rej(new Error('Não foi possível carregar o leitor. Abra o app com internet uma vez e tente de novo.'));document.head.appendChild(s)})}
async function loadXlsx(){if(!window.XLSX)await loadScript('xlsx.full.min.js');return window.XLSX}
const MES_FULL=['janeiro','fevereiro','marco','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
function monthCol(v){const n=norm(String(v??'')).replace(/[^a-z]/g,'');if(!n)return 0;const i=MES_FULL.findIndex(x=>x===n||(n.length===3&&x.startsWith(n)));return i+1}
function parsePlanilha(X,wb){
  const sheets=[];
  for(const name of wb.SheetNames){
    const rows=X.utils.sheet_to_json(wb.Sheets[name],{header:1,raw:true,defval:null,blankrows:true});
    let hr=-1,cols={};
    for(let i=0;i<Math.min(rows.length,20);i++){const c={};(rows[i]||[]).forEach((v,j)=>{const mm=monthCol(v);if(mm&&!Object.values(c).includes(mm))c[j]=mm});if(Object.keys(c).length>=6){hr=i;cols=c;break}}
    if(hr<0)continue;
    let year=Number((name.match(/\b(20\d{2})\b/)||[])[1])||0;
    if(!year){for(const r of rows.slice(0,hr+1))for(const v of r||[]){const mt=String(v??'').match(/\b(20\d{2})\b/);if(mt){year=Number(mt[1]);break}}}
    const items=[];let sec=null;
    for(const r of rows.slice(hr+1)){
      const label=String((r||[])[0]??'').replace(/\s+/g,' ').trim();if(!label)continue;
      const n=norm(label);
      if(/despesas? fixa|saida.*fix|gastos? fix|contas? fix/.test(n)){sec='fixa';continue}
      if(/despesas? variave|saida.*variav|gastos? variav/.test(n)){sec='variavel';continue}
      if(/^entrada|receitas?\b.*:|^receitas$|entrada.*receita/.test(n)&&!/^receita$/.test(n)){sec='entrada';continue}
      if(/^investimento/.test(n)){sec='invest';continue}
      if(/^total|^balanco|^acumulado|^saldo|^receita$|^fixo$|^variavel$|^resumo/.test(n)){if(/^total$/.test(n)&&sec)sec=sec;continue}
      if(!sec||sec==='invest')continue;
      const vals=Array(12).fill(0);
      for(const [j,mm] of Object.entries(cols)){const v=r[j];const x=typeof v==='number'?v:parseNum(v);vals[mm-1]=isFinite(x)?round2(Math.abs(x)):0}
      if(vals.every(v=>!v))continue;
      items.push({name:label.charAt(0).toUpperCase()+label.slice(1),sec,vals});
    }
    if(items.length)sheets.push({name,year,items});
  }
  return sheets;
}
const CARD_RE=/nubank|santander|itau|\binter\b|mercado ?pago|cartao|bradesco|\bc6\b|picpay|caixa|\bbb\b|banco|fatura|credicard|porto seguro card|neon|next/;
const BUDGET_RE=/aliment|mercado|supermerc|gasolina|combust|lazer|farmacia|feira|restaurante|delivery|ifood|roupa|presente/;
function planDefault(it){
  const n=norm(it.name);
  if(it.sec==='entrada')return 'entrada';
  if(it.sec==='variavel'&&CARD_RE.test(n))return 'nao';
  if(BUDGET_RE.test(n))return 'orc';
  return 'fixa';
}
function valsLabel(vals){
  const nz=vals.filter(v=>v>0);const mn=Math.min(...nz),mx=Math.max(...nz);
  const ms=vals.map((v,i)=>v>0?i:-1).filter(i=>i>=0);
  const per=ms.length===12?'todo mês':ms.length===1?MES_FULL[ms[0]].slice(0,3):`${MES_FULL[ms[0]].slice(0,3)} a ${MES_FULL[ms[ms.length-1]].slice(0,3)}`;
  return `${mn===mx?money(mn):money(mn)+' a '+money(mx)} · ${per}`;
}
function openPlanilhaDialog(p){return new Promise(resolve=>{

    <div class="review">${groups.map(g=>`<div class="rv-h">${secName[g.sec]}</div>${g.items.map((it,i)=>{const k=sh.items.indexOf(it);return `<div class="pl"><div class="pl-n"><b>${esc(it.name)}</b><small class="muted num">${valsLabel(it.vals)}</small></div><select data-pl="${k}" aria-label="O que fazer com ${esc(it.name)}">
      <option value="fixa" ${it.choice==='fixa'?'selected':''}>Conta fixa</option><option value="entrada" ${it.choice==='entrada'?'selected':''}>Entrada fixa</option><option value="orc" ${it.choice==='orc'?'selected':''}>Limite no orçamento</option><option value="nao" ${it.choice==='nao'?'selected':''}>Não importar</option></select></div>`}).join('')}`).join('')}</div>
    <div class="dlg-act"><button class="btn" id="plCancel">${p.step?'Pular arquivo':'Cancelar'}</button><button class="btn primary" id="plGo">Importar</button></div>`,()=>{

        const y=parseInt($('#plYear').value,10)||year;
        const r=applyPlanilha(sh.items,y);
        render();toast(`${r.fx} conta${r.fx===1?'':'s'} fixa${r.fx===1?'':'s'}${r.inc?`, ${r.inc} entrada${r.inc===1?'':'s'}`:''}${r.orc?` e ${r.orc} limite${r.orc===1?'':'s'} de orçamento`:''}`);
        resolve(r);closeDlg();
      };
    },()=>resolve(null));
  };
  draw();
})}
function applyPlanilha(items,year){
  const cur=monthOf(todayISO());let fx=0,inc=0,orc=0;const touched=new Set();
  for(const it of items){
    if(it.choice==='nao')continue;
    const lastNz=(()=>{for(let i=11;i>=0;i--)if(it.vals[i]>0)return i;return -1})(),firstNz=it.vals.findIndex(v=>v>0);
    if(it.choice==='orc'){
      const cat=categorize(it.name,-1);const ci=Number(cur.slice(5))-1;
      const v=Number(cur.slice(0,4))===year&&it.vals[ci]>0?it.vals[ci]:it.vals[lastNz];
      S.budgets[cat]=round2((touched.has(cat)?S.budgets[cat]||0:0)+v);touched.add(cat);orc++;continue;
    }
    const kind=it.choice==='entrada'?'entrada':'saida';
    let f=fxList().find(x=>norm(x.name)===norm(it.name)&&x.kind===kind);
    if(!f){f={id:uid(),name:it.name,kind,amount:0,day:null,cat:categorize(it.name,kind==='entrada'?1:-1),match:'',start:null,end:null,amounts:{},paid:{}};fxList().push(f)}
    f.amounts=f.amounts||{};
    it.vals.forEach((v,i)=>{f.amounts[`${year}-${pad(i+1)}`]=v});
    const st=`${year}-${pad(firstNz+1)}`;if(!f.start||st<f.start)f.start=st;
    f.amount=it.vals[lastNz];
    f.end=it.vals[11]>0?null:`${year}-${pad(lastNz+1)}`;
    kind==='entrada'?inc++:fx++;
  }
  persist();view.tab='fixas';
  return {fx,inc,orc};
}

function csvRows(text){

function parseCSV(text){

    if(d>-1&&(a>-1||(c>-1&&b>-1))){h=i;dc=d;ac=a;cc=c;bc=b;sc=r.findIndex(x=>/descri|historico|title|estabelecimento|lancamento|memo|detalhe/.test(x)&&!/^data/.test(x));break}}

async function pdfToLines(buf,password){
  const lib=await loadPdfJs();

  const lines=[];
  for(let p=1;p<=doc.numPages;p++){
    const page=await doc.getPage(p);const tc=await page.getTextContent();const rows=[];
    for(const it of tc.items){if(!it.str||!it.str.trim())continue;
      const x=it.transform[4],y=it.transform[5],h=Math.abs(it.transform[3])||8;
      let r=rows.find(r=>Math.abs(r.y-y)<=Math.max(2,h*.45));if(!r){r={y,items:[]};rows.push(r)}
      r.items.push({x,s:it.str,w:it.width||0})}
    rows.sort((a,b)=>b.y-a.y);
    for(const r of rows){r.items.sort((a,b)=>a.x-b.x);let s='',end=null;
      for(const it of r.items){if(end!==null){const gap=it.x-end;s+=gap>6?'   ':gap>0.8?' ':''}s+=it.s;end=it.x+it.w}
      lines.push(s.replace(/\s+$/,''))}
  }
  return lines;
}

    const nr=norm(rest);
    const amts=[...rest.matchAll(AMT_RE)].map(a=>{const sg=(a[1]||'')+(a[2]||'');return {raw:a[0],v:parseNum(a[3]),neg:/[-−–]/.test(sg)||!!(a[4]&&/[-−–D]/.test(a[4])),pos:/\+/.test(sg)||!!(a[4]&&/C/.test(a[4]))}});
    if(/\bsaldo\b|\bs a l d o\b/.test(n)){flushPend(null);if(amts.length&&!isCard){const a=amts[amts.length-1];prevBal=a.neg?-a.v:a.v;lastBal=prevBal;lastBalDate=cur}return}
    if(!amts.length){
      if(SKIP.test(n)){flushPend(null);return}
      const t=clean(rest);
      if(!hadDate&&t.length>=2&&t.length<80&&/[a-z]/i.test(t)&&!/^(cpf|cnpj|agencia|conta)\b/.test(norm(t))){pend.push(t);if(pend.length>4)pend.shift()}
      return}
    if(!cur){pend=[];return}
    if(SKIP.test(nr)){flushPend(null);return}
    let desc=rest;for(const a of amts)desc=desc.replace(a.raw,' ');
    desc=clean(desc);
    if(desc&&(desc.length<2||!/[a-z]/i.test(desc)))desc='';
    const holder={desc};flushPend(holder);desc=holder.desc;const wantsTail=!!holder.wantsTail;
    if(desc.length<2){if(!hadDate)return;desc=holder.desc||''}
    const a=amts[0];let sign=0,guess=false;
    if(isCard){
      if(/pagamento|estorno|credito|reembolso|cashback|devolucao/.test(norm(desc)))sign=1;
      else sign=a.neg?1:-1;
    } else {
      if(a.neg)sign=-1;else if(a.pos)sign=1;
      if(amts.length>=2){const b=amts[amts.length-1];const bal=b.neg?-b.v:b.v;
        if(!sign&&prevBal!=null){if(Math.abs(prevBal+a.v-bal)<0.02)sign=1;else if(Math.abs(prevBal-a.v-bal)<0.02)sign=-1}
        prevBal=bal;lastBal=bal;lastBalDate=cur}
      else if(prevBal!=null&&sign)prevBal=round2(prevBal+sign*a.v);
      if(!sign&&section)sign=section;
      if(!sign){guess=true;sign=/recebid|salario|deposito|credito|estorno|rendimento|resgate|reembolso|devolucao|\bted recebida|transferencia recebida/.test(norm(desc))?1:-1}
    }
    out.push({date:cur,amt:round2(sign*a.v),desc,guess,wantsTail});
  });
  flushPend(null);
  out.forEach(t=>{t.desc=t.desc.replace(/\s+/g,' ').trim()||'Lançamento';delete t.wantsTail});
  const tx=out.filter(t=>t.amt!==0&&isFinite(t.amt));
  return {format:'PDF',isCard,bank:'',acctid:'',tx,balance:isCard?null:lastBal,balDate:isCard?null:(lastBalDate&&lastBalDate<=todayISO()?lastBalDate:null)};
}

function importTx(acc,list){
  const ck=t=>t.date+'|'+t.amt.toFixed(2)+'|'+norm(t.desc).replace(/\s+/g,' ');
  const F={},C={},A={};const inc=(o,k)=>o[k]=(o[k]||0)+1;
  for(const t of S.tx){if(t.acc!==acc.id)continue;inc(A,ck(t));if(t.fitid)inc(F,t.fitid);else inc(C,ck(t))}
  let added=0,skipped=0;
  for(const t of list){const c=ck(t);let dup=false;
    if(t.fitid){if(F[t.fitid]>0){F[t.fitid]--;dup=true}else if(C[c]>0){C[c]--;dup=true}}
    else if(A[c]>0){A[c]--;dup=true}
    if(dup){skipped++;continue}
    S.tx.push({id:uid(),acc:acc.id,date:t.date,amt:t.amt,desc:t.desc,cat:(acc.type==='cartao'&&t.amt>0&&/pagamento|pagto|pgto/.test(norm(t.desc)))?'fatura':categorize(t.desc,t.amt),...(t.fitid?{fitid:t.fitid}:{})});added++}
  return {added,skipped};
}

async function checkShared(){
  if(!new URLSearchParams(location.search).has('compartilhado'))return;
  history.replaceState(null,'',location.pathname);
  try{
    const c=await caches.open('caixa-share');
    const keys=(await c.keys()).sort((a,b)=>Number(a.url.split('/').pop())-Number(b.url.split('/').pop()));
    const files=[];
    for(const k of keys){const r=await c.match(k);const b=await r.blob();files.push(new File([b],decodeURIComponent(r.headers.get('X-File-Name')||'extrato'),{type:b.type}));await c.delete(k)}
    if(files.length){if(locked)afterUnlock.push(()=>importFiles(files));else importFiles(files)}else toast('Nenhum arquivo recebido. Tente compartilhar de novo.');
  }catch(e){toast('Não foi possível receber o arquivo compartilhado.')}
}

const b64=buf=>btoa(String.fromCharCode(...new Uint8Array(buf)));

async function hashPw(pw,salt,iter){

    user:{id:crypto.getRandomValues(new Uint8Array(16)),name:nm,displayName:(LK&&LK.name)||nm},
    pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],

const metaOf=X=>({accounts:X.accounts||[],budgets:X.budgets||{},rules:X.rules||{},fixed:X.fixed||[],lastBackup:X.lastBackup||null});
function snapToState(snap){
  const next={accounts:[],tx:[],budgets:{},rules:{},fixed:[],lastBackup:null},last={};
  snap.forEach(d=>{const v=d.data()||{};
    if(d.id==='meta'){Object.assign(next,metaOf(v));last.meta=JSON.stringify(metaOf(v))}
    else if(d.id.startsWith('tx-')){const it=v.items||[];next.tx.push(...it);last[d.id]=JSON.stringify(it)}});
  return {next,last};
}
function startSync(user){
  FB.user=user;FB.first=true;
  FB.col=FB.db.collection('users').doc(user.uid).collection('data');
  if(FB.unsub)FB.unsub();
  setStatus('loading');
  FB.unsub=FB.col.onSnapshot(snap=>{
    const {next,last}=snapToState(snap);
    if(FB.first){
      FB.first=false;
      const local=loadLocal();const localHas=local&&((local.tx||[]).length||(local.accounts||[]).length||(local.fixed||[]).length);
      if(localHas&&!snap.size){
        S={accounts:[],budgets:{},rules:{},fixed:[],...local};FB.last={};flush();try{localStorage.removeItem(LS_KEY)}catch(e){}
        toast('Os dados deste aparelho foram enviados para a sua conta');
      } else if(localHas&&snap.size){
        S=next;FB.last=last;
        afterUnlock.push(()=>chooseData(local));
      } else {S=next;FB.last=last}
      setStatus(snap.metadata&&snap.metadata.fromCache?'offline':'synced');
      pickDefaultMonth();
      if(migrateBanks())persist();
      if(justSignedIn){justSignedIn=false;offerBioThenUnlock()}
      else lockNow();
      return;
    }
    const changed=Object.keys({...last,...FB.last}).some(k=>last[k]!==FB.last[k]);
    setStatus(snap.metadata&&snap.metadata.hasPendingWrites?'saving':snap.metadata&&snap.metadata.fromCache?'offline':'synced');
    if(!changed)return;
    if(store.timer){return}
    S=next;FB.last=last;if(!locked)render();
  },err=>{console.error(err);setStatus('error')});
}

  try{
    if(!(window.firebase&&firebase.firestore)){for(const f of ['firebase-app-compat.js','firebase-auth-compat.js','firebase-firestore-compat.js'])await loadScriptOnce(f)}
    if(!firebase.apps.length)firebase.initializeApp(cfg);
    FB.auth=firebase.auth();FB.db=firebase.firestore();
    try{await FB.db.enablePersistence({synchronizeTabs:true})}catch(e){}
  }catch(e){lockScreen(`<h1>Sem conexão</h1><p class="lock-msg">Não foi possível carregar o app. Abra com internet uma vez e tente de novo.</p><div class="setup-form"><button class="btn primary" onclick="location.reload()">Tentar de novo</button></div>`);return}
  FB.auth.onAuthStateChanged(u=>{
    if(!u){FB.user=null;if(FB.unsub){FB.unsub();FB.unsub=null}showLogin();return}
    if(FB.user&&FB.user.uid===u.uid){FB.user=u;return}
    if(justSignedIn)return;
    if(!LK||LK.uid!==u.uid){LK={...(LK||{}),uid:u.uid,email:u.email,name:u.displayName||'',after:LK&&LK.after!=null?LK.after:0};saveLK()}
    startSync(u);
  });
}



boot();
checkShared();
</script>
</body>
</html>
